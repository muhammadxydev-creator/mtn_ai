version: '3.8'

services:
  # MongoDB Database (Cloud or Local)
  mongodb:
    image: mongo:7
    container_name: tgo-api-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
      MONGO_INITDB_DATABASE: tgo_api
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tgo-network

  # Redis (for caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: tgo-api-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tgo-network

  # TGO API Service (Main + Internal)
  tgo-api:
    build: .
    container_name: tgo-api
    ports:
      - "8000:8000"  # Main API (requires authentication)
      - "8001:8001"  # Internal API (no authentication)
    environment:
      - MONGODB_URL=mongodb://mongoadmin:mongopassword@mongodb:27017/tgo_api?authSource=admin
      - MONGODB_DB_NAME=tgo_api
      - SECRET_KEY=your-secret-key-here-change-in-production-min-32-chars
      - REDIS_URL=redis://redis:6379/0
      - INTERNAL_SERVICE_HOST=0.0.0.0
      - INTERNAL_SERVICE_PORT=8001
      - RAG_SERVICE_URL=http://localhost:8001
      - AI_SERVICE_URL=http://localhost:8002
      - PLATFORM_SERVICE_URL=http://localhost:8003
      - WUKONGIM_API_URL=http://localhost:5001
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tgo-network
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  tgo-network:
    driver: bridge
